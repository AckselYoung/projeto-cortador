<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tela">
        <div class="box">
            <form action="">
                <fieldset>
                    <legend>Cadastro de Cortadores</legend>
                    <div class="inputArea">
                        <br><br>
                        <label for="snAntigo" id="snAntigoLabel">NÚMERO DE SÉRIE ANTIGO</label>
                        <input type="text" name="snAntigo", id="snAntigoInput">
                        <label for="datRetirada">DATA DA RETIRADA</label>
                        <input type="date" name="datRetirada", id="dataRetirada">
                        <br>
                        <br>
                        <label for="snNovo">NÚMERO DE SÉRIE NOVO</label>
                        <input type="text" name="snNovo" id="snNovo">
                        <label for="">DATA INSTALAÇÃO</label>
                        <input type="date" name="datInstalacao" id="dataInstalacao">
                        <label for="impressora">IMPRESSORA</label>
                        <input type="text" name ="impressora" id="nomeImp">
                        <br><br>

                        <label for="desc">DESC. SERVIÇO</label>
                        <br>
                        <textarea name="desc" id="descservice" cols="30" rows="4"></textarea>
                        <br>
                        <label for="obs">OBS</label>
                        <input type="text" name="obs" id="obs">
                        <label for="analista">ANALISTA</label>
                        <input type="text" name="analista" id="analistaNome"><br>
                        
                        <input type="submit" name="submit" id="submit">
                        <br><br>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</body>
</html>
